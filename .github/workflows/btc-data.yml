name: Update BTC data

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Kraken BTC OHLCV
        run: |
          mkdir -p data

          curl -fsSL \
            "https://api.kraken.com/0/public/OHLC?pair=XBTUSD&interval=60" \
            -o data/btc-1h.json

          curl -fsSL \
            "https://api.kraken.com/0/public/OHLC?pair=XBTUSD&interval=240" \
            -o data/btc-4h.json

          curl -fsSL \
            "https://api.kraken.com/0/public/OHLC?pair=XBTUSD&interval=1440" \
            -o data/btc-1d.json

          date -u +"%Y-%m-%dT%H:%M:%SZ" > data/updated.txt


      - name: Download Bitcoin Lab on-chain data
        continue-on-error: true
        env:
          BITLAB_API_TOKEN: ${{ secrets.BITCOINLAB_API_TOKEN }}

        run: |
          set -u

          # Automatisch nur alle 4 Stunden.
          # Bei manuellem "Run workflow" immer ausführen.
          HOUR=$(date -u +%H)

          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] &&
             [ $((10#$HOUR % 4)) -ne 0 ]; then
            echo "No on-chain refresh this hour"
            exit 0
          fi

          if [ -z "${BITLAB_API_TOKEN:-}" ]; then
            echo "ERROR: BITCOINLAB_API_TOKEN missing"
            exit 1
          fi

          mkdir -p data

          BASE="https://api.researchbitcoin.net"
          FROM_TIME=$(date -u -d "8 days ago" +"%Y-%m-%dT%H:%M:%SZ")
          TO_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          SUCCESS=0
          FAILED=0

          fetch_metric () {
            GROUP="$1"
            FIELD="$2"
            FILE="$3"
            TMP="${FILE}.tmp"

            rm -f "$TMP"

            echo "Fetching $GROUP/$FIELD ..."

            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 40 \
              --retry 1 \
              --retry-delay 5 \
              -H "X-API-Token: $BITLAB_API_TOKEN" \
              -H "Accept: application/json" \
              --get "$BASE/v2/$GROUP/$FIELD" \
              --data-urlencode "from_time=$FROM_TIME" \
              --data-urlencode "to_time=$TO_TIME" \
              --data-urlencode "resolution=h4" \
              --data-urlencode "output_format=json" \
              -o "$TMP" &&
              jq -e . "$TMP" >/dev/null
            then
              mv "$TMP" "$FILE"
              SUCCESS=$((SUCCESS + 1))
              echo "OK: $FIELD"
            else
              rm -f "$TMP"
              FAILED=$((FAILED + 1))
              echo "FAILED: $FIELD"
            fi
          }


          # 1. Kostenbasis kurzfristiger Anleger
          fetch_metric \
            "realizedprice" \
            "realized_price_sth" \
            "data/onchain-realized-price-sth.json"

          # 2. Kostenbasis langfristiger Anleger
          fetch_metric \
            "realizedprice" \
            "realized_price_lth" \
            "data/onchain-realized-price-lth.json"

          # 3. STH-Bewertung / Überhitzung / Kapitulation
          fetch_metric \
            "market_value_to_realized_value" \
            "mvrv_z_52k_window_sth" \
            "data/onchain-mvrv-z-sth.json"

          # 4. Gewinn-/Verlustrealisierung kurzfristiger Anleger
          fetch_metric \
            "spent_output_profit_ratio" \
            "sopr_sth" \
            "data/onchain-sopr-sth.json"

          # 5. Tatsächlich realisierter Gewinn/Verlust der STH
          fetch_metric \
            "net_realized_profit_loss" \
            "net_realized_profit_loss_sth" \
            "data/onchain-nrpl-sth.json"

          # 6. Kapitalzufluss / Kapitalabfluss
          fetch_metric \
            "realizedcap" \
            "realized_cap" \
            "data/onchain-realized-cap.json"

          # 7. Bewegung älterer Coins / Distribution
          fetch_metric \
            "cointime_statistics" \
            "liveliness" \
            "data/onchain-liveliness.json"

          # 8. Ökonomische Kostenbasis aktiver Marktteilnehmer
          fetch_metric \
            "cointime_statistics" \
            "true_market_meanprice" \
            "data/onchain-true-market-mean.json"

          # 9. Übergeordnete Marktzyklus-Bewertung
          fetch_metric \
            "market_value_to_realized_value" \
            "mvrv_z" \
            "data/onchain-mvrv-z.json"


          echo "Successful metrics: $SUCCESS"
          echo "Failed metrics: $FAILED"

          # Nur als frisch markieren, wenn alle neun Abfragen
          # tatsächlich erfolgreich waren.
          if [ "$SUCCESS" -eq 9 ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" \
              > data/onchain-updated.txt
            echo "On-chain dataset complete"
          else
            echo "On-chain dataset incomplete - freshness timestamp unchanged"
          fi


      - name: Save data
        if: always()
        run: |
          rm -f data/*.tmp

          git config user.name "btc-data-bot"
          git config user.email "btc-data-bot@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update BTC and on-chain data"

          git pull --rebase
          git push
